<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="description" content="Basquete Stats PRO — central de análise esportiva para basquete (NBA), futebol e tênis, com calendário, resultados históricos e estatísticas.">
<title>Basquete Stats PRO</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>

<header class="top">
  <div class="ball"></div>
  <div class="wrap brand">
    <div class="logo"><span class="ico" data-i="ball"></span></div>
    <div>
      <h1>Basquete <b>Stats</b><span class="pro">PRO</span></h1>
      <p>Central de Análise Esportiva · NBA · Futebol · Tênis</p>
    </div>
    <div class="livepill" id="livePill"><span class="dot"></span><span id="liveTxt">Ao vivo</span></div>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="aovivo"><span class="reddot"></span>Ao vivo<span class="cnt" id="liveCnt" hidden></span></button>
    <button class="tab" data-tab="nba"><span class="ico" data-i="ball"></span>NBA</button>
    <button class="tab" data-tab="totais"><span class="ico" data-i="bars"></span>Totais</button>
    <button class="tab" data-tab="futebol"><span class="ico" data-i="soccer"></span>Futebol</button>
    <button class="tab" data-tab="tenis"><span class="ico" data-i="tennis"></span>Tênis</button>
  </div>
  <main id="view"></main>
  <p class="src">Fonte: ESPN. Disponibilidade de placares e estatísticas varia conforme esporte, liga e partida. Horários no seu fuso local.</p>
</div>

<nav class="bot"><div class="in" id="bot">
  <button data-v="inicio"><span class="ico" data-i="home"></span>Início</button>
  <button data-v="calendario"><span class="ico" data-i="cal"></span>Calendário</button>
  <button data-v="resultados"><span class="ico" data-i="bars"></span>Resultados</button>
  <button data-v="estatisticas"><span class="ico" data-i="trophy"></span>Estatísticas</button>
  <button data-v="config"><span class="ico" data-i="gear"></span>Configurações</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
</body>
</html>
